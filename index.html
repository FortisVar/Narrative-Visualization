<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titanic Narrative Visualization</title>

    <link rel="stylesheet" href="styles.css"></head>
<body>

    <h1>Titanic Narrative Visualization</h1>

    <p id="data-status"></p>

    <div id="tooltip"></div>

    <h2>Overview Graph</h2>
    <svg id="overview-graph">
        <circle id="total-passengers"></circle>
        <text id="total-passengers-text"></text>

        <circle id="total-survivors"></circle>
        <text id="total-survivors-text"></text>

        <circle id="total-deaths"></circle>
        <text id="total-deaths-text"></text>
    </svg>

    <h2>Gender Graph</h2>
    <svg id="gender-graph"></svg>

    <h2>Class Graph</h2>
    <svg id="class-graph"></svg>

    <h2>Age Graph</h2>
    <svg id="age-graph"></svg>

    <label>
        Age bins:<span id="age-slider-num">10</span>
        <input id="age-slider" type="range" min="3" max="30" value="10" step="1">
    </label>

    <h2>Passenger Graph</h2>
    <svg id="passenger-graph"></svg>

    <h2>Filter Options</h2>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="index.js"></script>
</body>
</html>
