<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Titanic Narrative Visualization</title>

    <link rel="stylesheet" href="styles.css"></head>
<body>

    <h1>Titanic Narrative Visualization</h1>

    <p id="data-status"></p>

    <div id="tooltip"></div>

    <h2>Overview Graph</h2>
    <svg id="overview-graph">
        <circle id="total-passengers"></circle>
        <text id="total-passengers-text"></text>

        <circle id="total-survivors"></circle>
        <text id="total-survivors-text"></text>

        <circle id="total-deaths"></circle>
        <text id="total-deaths-text"></text>
    </svg>

    <h2>Gender Graph</h2>
    <svg id="gender-graph"></svg>

    <h2>Class Graph</h2>
    <svg id="class-graph"></svg>

    <h2>Age Graph</h2>
    <svg id="age-graph"></svg>

    <label>
        Age bins:<span id="age-slider-num">10</span>
        <input id="age-slider" type="range" min="3" max="30" value="10" step="1">
    </label>

    <h2>Passenger Graph</h2>
    <svg id="passenger-graph"></svg>

    <h2>Filter Options</h2>

    <label>
        Age max:<span id="age-filter-max-slider-num">100</span>
        <input id="age-filter-max-slider" type="range" min="0" max="100" value="100" step="1">
    </label>

    <br>

    <label>
        Age min:<span id="age-filter-min-slider-num">0</span>
        <input id="age-filter-min-slider" type="range" min="0" max="100" value="0" step="1">
    </label>

    <br>
    <br>

    <label>
        <span>First Class</span>
        <input id="first-class-filter" type="checkbox">
    </label>

    <label>
        <span>Second Class</span>
        <input id="second-class-filter" type="checkbox">
    </label>

    <label>
        <span>Third Class</span>
        <input id="third-class-filter" type="checkbox">
    </label>

    <br>
    <br>

    <label>
        <span>Male</span>
        <input id="male-filter" type="checkbox">
    </label>

    <label>
        <span>Female</span>
        <input id="female-filter" type="checkbox">
    </label>




    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="index.js"></script>
</body>
</html>
